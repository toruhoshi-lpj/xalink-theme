name: Check CPI Server Directories

on:
  push:
    branches:
      - main

jobs:
  check-dir:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: List Server Directories
        run: |
          lftp -f "
          set sftp:auto-confirm yes
          open -u ${{ secrets.SFTP_USERNAME }},${{ secrets.SFTP_PASSWORD }} -p 10397 sftp://${{ secrets.SFTP_SERVER }}
          pwd
          ls -la
          quit
          "