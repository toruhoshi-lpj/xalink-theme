name: Deploy Theme to CPI Test Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: SFTP Upload via lftp
        run: |
          lftp -f "
          set sftp:auto-confirm yes
          open -u ${{ secrets.SFTP_USERNAME }},${{ secrets.SFTP_PASSWORD }} -p 10397 sftp://${{ secrets.SFTP_SERVER }}
          mkdir -p html/xalink.jp/wp-content/themes/xalink-theme
          mirror --reverse --delete --verbose ./ html/xalink.jp/wp-content/themes/xalink-theme/
          quit
          "