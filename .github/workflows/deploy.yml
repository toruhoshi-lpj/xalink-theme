name: Deploy Theme to CPI Test Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SFTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          sftp-ssh-key: ${{ secrets.SFTP_KEY }}
          port: ${{ secrets.SFTP_PORT }}
          protocol: sftp
          # CPIの転送先ディレクトリ（実在するテーマフォルダ名に変更してください）
          server-dir: /html/wp-content/themes/xalink-theme/